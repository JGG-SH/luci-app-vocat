name: Update OpenWrt Version List

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest OpenWrt stable releases (top 5, exclude rc)
        id: get_releases
        run: |
          RELEASES=$(curl -s \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/openwrt/openwrt/releases?per_page=100 \
            | jq -r '[.[] | select(.tag_name | contains("rc") | not)] | .[0:5] | .[].tag_name')
          echo "releases<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update release options in build-ipk.yml and build-apk.yml
        run: |
          RELEASES="${{ steps.get_releases.outputs.releases }}"
          if [ -z "$RELEASES" ]; then
            echo "Failed to fetch release list, exiting."
            exit 1
          fi
          # Build JSON array from release list, append 'snapshot'
          JSON_ARRAY=$(echo "$RELEASES" | jq -R -s -c 'split("\n")[:-1] | . + ["snapshot"]')
          # Update both YAML files using yq
          yq eval -i '.on.workflow_dispatch.inputs.release.options = '"$JSON_ARRAY" .github/workflows/build-ipk.yml
          yq eval -i '.on.workflow_dispatch.inputs.release.options = '"$JSON_ARRAY" .github/workflows/build-apk.yml

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-ipk.yml .github/workflows/build-apk.yml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: auto update OpenWrt version list [skip ci]"
            git push
          fi
