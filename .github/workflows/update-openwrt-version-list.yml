name: Update OpenWrt Version List

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest OpenWrt stable releases (top 5, exclude rc)
        id: get_releases
        run: |
          RELEASES=$(curl -s \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/openwrt/openwrt/releases?per_page=100 \
            | jq -r '[.[] | select(.tag_name | contains("rc") | not)] | .[0:5] | .[].tag_name')
          echo "releases<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update options in build-ipk.yml and build-apk.yml
        run: |
          RELEASES="${{ steps.get_releases.outputs.releases }}"
          if [ -z "$RELEASES" ]; then
            echo "Failed to fetch release list, exiting."
            exit 1
          fi

          # Build YAML array (10 spaces indent, matching existing options)
          YAML_LIST=""
          while IFS= read -r ver; do
            [ -z "$ver" ] && continue
            YAML_LIST="${YAML_LIST}          - '$ver'\n"
          done <<< "$RELEASES"
          YAML_LIST="${YAML_LIST}          - 'snapshot'"

          # Update build-ipk.yml
          sed -i "/^      release:/,/^      version:/c\\
      release:\n\
        description: 'OpenWrt version'\n\
        required: true\n\
        type: choice\n\
        options:\n\
$(echo -e "$YAML_LIST")\n\
      version:" .github/workflows/build-ipk.yml

          # Update build-apk.yml
          sed -i "/^      release:/,/^      version:/c\\
      release:\n\
        description: 'OpenWrt version'\n\
        required: true\n\
        type: choice\n\
        options:\n\
$(echo -e "$YAML_LIST")\n\
      version:" .github/workflows/build-apk.yml

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-ipk.yml .github/workflows/build-apk.yml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: auto update OpenWrt version list [skip ci]"
            git push
          fi
