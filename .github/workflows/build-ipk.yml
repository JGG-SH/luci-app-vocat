name: Build IPK Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenWrt 目标平台'
        required: true
        type: choice
        options:
          - 'qualcommax/ipq60xx'
          - 'qualcommax/ipq807x'
          - 'mediatek/filogic'
          - 'mediatek/mt7622'
          - 'rockchip/armv8'
          - 'bcm27xx/bcm2711'
          - 'ipq40xx/generic'
          - 'bcm53xx/generic'
          - 'bcm27xx/bcm2709'
          - 'x86/64'
          - 'x86/generic'
      release:
        description: 'OpenWrt 版本'
        required: true
        type: choice
        options:
          - '25.12.5'
          - '24.10.8'
          - '23.05.6'
          - 'snapshot'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout luci-app-vocat 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定界面版本号和安全 target 名称
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "界面版本: ${VERSION}"
          
          # 将 target 中的 / 替换为 -，用于 artifact 名称
          SAFE_TARGET=$(echo "${{ github.event.inputs.target }}" | sed 's|/|-|g')
          echo "safe_target=${SAFE_TARGET}" >> $GITHUB_OUTPUT
          echo "安全 target: ${SAFE_TARGET}"

      - name: 下载 SDK
        id: sdk
        run: |
          TARGET="${{ github.event.inputs.target }}"
          RELEASE="${{ github.event.inputs.release }}"
          echo "目标平台: $TARGET"
          echo "OpenWrt 版本: $RELEASE"
          if [ "$RELEASE" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/"
          else
            BASE_URL="https://downloads.openwrt.org/releases/${RELEASE}/targets/${TARGET}/"
          fi
          echo "SDK 目录: $BASE_URL"
          SDK_FILE=$(wget -q -O - "$BASE_URL" | grep -oP 'openwrt-sdk-[^"]*\.tar\.(xz|zst)' | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 无法从 $BASE_URL 获取 SDK 文件，请检查 target 和 release 是否正确"
            echo "提示: 尝试使用 snapshot 或更新版本"
            exit 1
          fi
          echo "找到 SDK: $SDK_FILE"
          wget -O sdk.tar "${BASE_URL}${SDK_FILE}"
          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar -xf sdk.tar --zstd
          else
            tar -xf sdk.tar
          fi
          mv openwrt-sdk-* sdk

      - name: 准备编译环境
        run: |
          mkdir -p sdk/package/luci-app-vocat
          rsync -av --exclude='sdk' ./ sdk/package/luci-app-vocat/
          cd sdk
          if [ -f package/luci-app-vocat/Makefile ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" package/luci-app-vocat/Makefile
          fi
          make defconfig

      - name: 编译 IPK
        run: |
          cd sdk
          make package/luci-app-vocat/compile V=s
          find bin/ -name "*.ipk" -exec cp {} ../ \;

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocat-luci-${{ steps.version.outputs.version }}-${{ steps.version.outputs.safe_target }}-ipk
          path: ./*.ipk

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "luci-app-vocat v${{ steps.version.outputs.version }} (IPK) for ${{ github.event.inputs.target }}"
          body: |
            ## luci-app-vocat v${{ steps.version.outputs.version }}
            - 界面版本: ${{ steps.version.outputs.version }}
            - 核心版本: 编译时从 JGG-SH/VoCat 自动获取最新
            - 目标平台: ${{ github.event.inputs.target }}
            - OpenWrt 版本: ${{ github.event.inputs.release }}
          files: ./*.ipk
