name: Build IPK Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenWrt 目标平台'
        required: true
        type: choice
        options:
          # --- arm64 架构 (AArch64) ---
          - 'qualcommax/ipq60xx'      # 高通 IPQ60xx 系列
          - 'qualcommax/ipq807x'      # 高通 IPQ807x 系列
          - 'mediatek/filogic'        # 联发科 Filogic 系列
          - 'mediatek/mt7622'         # 联发科 MT7622 系列
          - 'rockchip/armv8'          # 瑞芯微 ARMv8 系列
          - 'bcm27xx/bcm2711'         # 树莓派 4B / CM4
          # --- armv7 架构 (32位 ARM) ---
          - 'ipq40xx/generic'         # 高通 IPQ40xx 系列
          - 'bcm53xx/generic'         # 博通 BCM53xx 系列
          - 'bcm27xx/bcm2709'         # 树莓派 2B / 3B
          # --- amd64 架构 (64位 x86) ---
          - 'x86/64'                  # 64位 x86 软路由
          # --- 386 架构 (32位 x86) ---
          - 'x86/generic'             # 32位 x86 软路由
      release:
        description: 'OpenWrt 版本'
        required: true
        type: choice
        options:
          - '25.12.5'    # 最新稳定版 (推荐)
          - '24.10.8'    # 长期支持版
          - '23.05.6'    # 旧稳定版
          - 'snapshot'   # 开发快照版
      version:
        description: '界面版本号 (留空则自动从 Git Tag 获取)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout luci-app-vocat 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查并提醒 OpenWrt 最新版本
        id: check_release
        run: |
          echo "正在检查 OpenWrt 官方最新稳定版..."
          LATEST=$(curl -s \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/openwrt/openwrt/releases?per_page=100 \
            | jq -r '[.[] | select(.tag_name | contains("rc") | not)] | .[0].tag_name')
          SELECTED="${{ github.event.inputs.release }}"
          echo "您选择的版本: $SELECTED"
          echo "OpenWrt 官方最新稳定版: $LATEST"
          if [ -n "$LATEST" ] && [ "$SELECTED" != "$LATEST" ] && [ "$SELECTED" != "snapshot" ]; then
            echo "::warning title=版本更新可用::您选择的 $SELECTED 不是最新版本，建议使用 $LATEST"
          fi
          echo "selected_release=${SELECTED}" >> $GITHUB_OUTPUT

      - name: 确定界面版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "界面版本: ${VERSION}"

      - name: 下载 SDK
        id: sdk
        run: |
          TARGET="${{ github.event.inputs.target }}"
          RELEASE="${{ steps.check_release.outputs.selected_release }}"
          echo "目标平台: $TARGET"
          echo "OpenWrt 版本: $RELEASE"
          if [ "$RELEASE" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/"
          else
            BASE_URL="https://downloads.openwrt.org/releases/${RELEASE}/targets/${TARGET}/"
          fi
          echo "SDK 目录: $BASE_URL"
          SDK_FILE=$(wget -q -O - "$BASE_URL" | grep -oP 'openwrt-sdk-[^"]*\.tar\.(xz|zst)' | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 无法从 $BASE_URL 获取 SDK 文件，请检查 target 和 release 是否正确"
            echo "提示: 尝试使用 snapshot 或更新版本"
            exit 1
          fi
          echo "找到 SDK: $SDK_FILE"
          wget -O sdk.tar "${BASE_URL}${SDK_FILE}"
          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar -xf sdk.tar --zstd
          else
            tar -xf sdk.tar
          fi
          mv openwrt-sdk-* sdk

      - name: 准备编译环境
        run: |
          mkdir -p sdk/package/luci-app-vocat
          rsync -av --exclude='sdk' ./ sdk/package/luci-app-vocat/
          cd sdk
          if [ -f package/luci-app-vocat/Makefile ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" package/luci-app-vocat/Makefile
          fi
          make defconfig

      - name: 编译 IPK
        run: |
          cd sdk
          make package/luci-app-vocat/compile V=s
          find bin/ -name "*.ipk" -exec cp {} ../ \;

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocat-luci-${{ steps.version.outputs.version }}-${{ github.event.inputs.target }}-ipk
          path: ./*.ipk

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "luci-app-vocat v${{ steps.version.outputs.version }} (IPK) for ${{ github.event.inputs.target }}"
          body: |
            ## luci-app-vocat v${{ steps.version.outputs.version }}
            - 界面版本: ${{ steps.version.outputs.version }}
            - 核心版本: 编译时从 JGG-SH/VoCat 自动获取最新
            - 目标平台: ${{ github.event.inputs.target }}
            - OpenWrt 版本: ${{ steps.check_release.outputs.selected_release }}
          files: ./*.ipk
