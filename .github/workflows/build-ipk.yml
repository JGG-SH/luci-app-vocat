name: Build IPK Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenWrt 目标平台'
        required: true
        type: choice
        options:
          # --- arm64 架构 (AArch64) ---
          - 'qualcommax/ipq60xx'      # 高通 IPQ60xx 系列 (IPQ6000/6010/6018/8074)
          - 'qualcommax/ipq807x'      # 高通 IPQ807x 系列 (IPQ8074/8072)
          - 'mediatek/filogic'        # 联发科 Filogic 系列 (MT7981/MT7986)
          - 'mediatek/mt7622'         # 联发科 MT7622 系列
          - 'rockchip/armv8'          # 瑞芯微 ARMv8 系列 (RK3328/RK3399)
          - 'bcm27xx/bcm2711'         # 树莓派 4B / CM4
          # --- armv7 架构 (32位 ARM) ---
          - 'ipq40xx/generic'         # 高通 IPQ40xx 系列 (IPQ4018/4028/4019)
          - 'bcm53xx/generic'         # 博通 BCM53xx 系列
          - 'bcm27xx/bcm2709'         # 树莓派 2B / 3B
          # --- amd64 架构 (64位 x86) ---
          - 'x86/64'                  # 64位 x86 软路由
          # --- 386 架构 (32位 x86) ---
          - 'x86/generic'             # 32位 x86 软路由 (旧设备)
      release:
        description: 'OpenWrt 版本 (例如: 23.05.5, 24.10.0, snapshot)'
        required: true
        type: string
        default: '23.05.5'
      version:
        description: '界面版本号 (留空则自动从 Git Tag 获取)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout luci-app-vocat 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "界面版本: ${VERSION}"

      - name: 下载 SDK
        id: sdk
        run: |
          TARGET="${{ github.event.inputs.target }}"
          RELEASE="${{ github.event.inputs.release }}"
          echo "目标平台: $TARGET"
          echo "OpenWrt 版本: $RELEASE"
          if [ "$RELEASE" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/"
          else
            BASE_URL="https://downloads.openwrt.org/releases/${RELEASE}/targets/${TARGET}/"
          fi
          echo "SDK 目录: $BASE_URL"
          SDK_FILE=$(wget -q -O - "$BASE_URL" | grep -oP 'openwrt-sdk-[^"]*\.tar\.(xz|zst)' | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 无法从 $BASE_URL 获取 SDK 文件，请检查 target 和 release 是否正确"
            exit 1
          fi
          echo "找到 SDK: $SDK_FILE"
          wget -O sdk.tar "${BASE_URL}${SDK_FILE}"
          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar -xf sdk.tar --zstd
          else
            tar -xf sdk.tar
          fi
          mv openwrt-sdk-* sdk

      - name: 准备编译环境
        run: |
          mkdir -p sdk/package/luci-app-vocat
          # 使用 rsync 排除 sdk 目录，避免循环复制
          rsync -av --exclude='sdk' ./ sdk/package/luci-app-vocat/
          cd sdk
          if [ -f package/luci-app-vocat/Makefile ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" package/luci-app-vocat/Makefile
          fi
          make defconfig

      - name: 编译 IPK
        run: |
          cd sdk
          make package/luci-app-vocat/compile V=s
          find bin/ -name "*.ipk" -exec cp {} ../ \;

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocat-luci-${{ steps.version.outputs.version }}-${{ github.event.inputs.target }}-ipk
          path: ./*.ipk

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "luci-app-vocat v${{ steps.version.outputs.version }} (IPK) for ${{ github.event.inputs.target }}"
          body: |
            ## luci-app-vocat v${{ steps.version.outputs.version }}
            - 界面版本: ${{ steps.version.outputs.version }}
            - 核心版本: 编译时从 JGG-SH/VoCat 自动获取最新
            - 目标平台: ${{ github.event.inputs.target }}
            - OpenWrt 版本: ${{ github.event.inputs.release }}
          files: ./*.ipk
