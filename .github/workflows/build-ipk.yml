name: Build IPK Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '界面版本号 (留空则自动从 Git Tag 获取)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout luci-app-vocat 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 确定界面版本号
      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "界面版本: ${VERSION}"

      # 下载 OpenWrt SDK (稳定版, 用于生成 ipk)
      - name: 下载 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/23.05.5/targets/qualcommax/ipq60xx/openwrt-sdk-23.05.5-qualcommax-ipq60xx_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          wget -O sdk.tar.xz $SDK_URL
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* sdk

      # 将源码复制到 SDK 的 package 目录, 并设置界面版本号
      - name: 准备编译环境
        run: |
          cp -r . sdk/package/luci-app-vocat
          cd sdk
          # 在顶层 Makefile 中设置 PKG_VERSION (如果存在)
          if [ -f package/luci-app-vocat/Makefile ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" package/luci-app-vocat/Makefile
          fi
          # 生成默认配置
          make defconfig

      # 编译 vocat-core 和 luci-app-vocat
      - name: 编译 IPK
        run: |
          cd sdk
          make package/luci-app-vocat/compile V=s
          # 查找生成的 ipk 文件
          find bin/ -name "*.ipk" -exec cp {} ../ \;

      # 上传 IPK 作为 Artifact
      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocat-luci-${{ steps.version.outputs.version }}-arm64.ipk
          path: ./*.ipk

      # 如果是 Tag 触发, 创建 Release 并上传 IPK
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "luci-app-vocat v${{ steps.version.outputs.version }}"
          body: |
            ## luci-app-vocat v${{ steps.version.outputs.version }}
            - 界面版本: ${{ steps.version.outputs.version }}
            - 核心版本: 编译时从 JGG-SH/VoCat 自动获取最新
            - 架构: arm64 (适用于 IPQ60xx 设备)
            - 适用于 opkg 系统 (OpenWrt 23.05 及更早)
          files: ./*.ipk
